name: canarino-api
# 28/11/2026 — presidio delle API dell'app attraverso l'edge (regola ferma di Gianluca, 02:19):
# 403 o 5xx DUE volte di fila = rollback dell'edge + allarme. Il canarino gira anche alla fine
# di feed-sync, perché GitHub dirada le schedulazioni (misurato: 1 giro in 2 ore con */5).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["feed-sync"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canarino-api
  cancel-in-progress: true
jobs:
  canarino:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chiama le API dell'app
        id: canarino
        continue-on-error: true
        run: node scripts/canarino-api.mjs
      - name: Rollback dell'edge (solo dopo 2 fallimenti gravi di fila)
        if: steps.canarino.outputs.rollback == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=d5d20864ee7f83c32c9eeb5fcbda6edb
          echo "rollback richiesto: ${{ steps.canarino.outputs.dettaglio }}"
          PREV=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/careauctions-edge/deployments?per_page=2" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['result']; d=d.get('deployments') if isinstance(d,dict) else d; print(d[1]['id'] if len(d)>1 else '')")
          echo "deployment precedente: $PREV"
          if [ -n "$PREV" ]; then
            curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/careauctions-edge/deployments/$PREV/rollback" \
              -o /tmp/_rb.json -w "rollback http %{http_code}\n"; head -c 200 /tmp/_rb.json; echo
          fi
      - name: Allarme (solo se guasto)
        if: steps.canarino.outputs.guasto == 'si'
        env:
          REGIA_KEY: ${{ secrets.REGIA_KEY }}
          DETTAGLIO: ${{ steps.canarino.outputs.dettaglio }}
          CONSECUTIVI: ${{ steps.canarino.outputs.consecutivi }}
        run: |
          python3 - <<'PY2'
          import json,os,urllib.request
          k=os.environ.get('REGIA_KEY','')
          det=os.environ.get('DETTAGLIO','')
          cons=os.environ.get('CONSECUTIVI','0')
          testo=('Il canarino ha trovato: '+det+'. Fallimenti consecutivi: '+cons+'. '
                 'Se compare 403 il segreto condiviso non coincide: controllare ORIGIN_AUTH e ICARE_ORIGIN_AUTH di careauctions-edge. '
                 'Al secondo fallimento grave il workflow fa il rollback da solo.')
          body=json.dumps({'azione':'invia-email','chiave':k,'a':'info@puntoluce26.com',
                           'oggetto':'CARe attenzione — API dell app non rispondono','testo':testo}).encode()
          req=urllib.request.Request('https://icare-ai.misty-mode-1cbc.workers.dev',data=body,headers={'Content-Type':'application/json'})
          print(urllib.request.urlopen(req,timeout=30).read().decode()[:200])
          PY2
      - name: Registra lo stato
        if: always()
        run: |
          git config user.name "CARe Cloud"; git config user.email "cloud@careauctions.co"
          git add qa/canarino-api.json qa/uptime.csv
          git diff --cached --quiet && exit 0
          git commit -m "canarino api: ${{ steps.canarino.outputs.guasto }} (consecutivi ${{ steps.canarino.outputs.consecutivi }})"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 10; done
