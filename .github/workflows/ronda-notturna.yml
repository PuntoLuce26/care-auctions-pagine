name: ronda-notturna

# Sorveglianza notturna di CAReAuctions, interamente in cloud (nessun Mac).
# Ogni 2 ore controlla sito, feed, QA, orchestra, sentinella AI, watcher del .it, DNS del .it,
# monitor posta, allineamento della build e gli ultimi run dei workflow; scrive qa/ronda-notturna.json.
# Alle 06:10 UTC (07:10 Europe/Rome) manda il riepilogo della notte via Gmail API.
# Run rossa SOLO per problemi veri e nuovi: una mail di GitHub per condizione, non una raffica.

on:
  schedule:
    - cron: '10 */2 * * *'
  workflow_dispatch:
    inputs:
      mail:
        description: "Manda il riepilogo via email (solo per prova manuale)"
        type: choice
        options:
          - "no"
          - "si"
        default: "no"

permissions:
  contents: write
  actions: write

concurrency:
  group: ronda-notturna
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Riepilogo email attivo?
        env:
          MAIL_INPUT: ${{ github.event.inputs.mail }}
        run: |
          if [ "$(date -u +%H)" = "06" ] || [ "${MAIL_INPUT:-}" = "si" ]; then
            echo "RONDA_MAIL=1" >> "$GITHUB_ENV"
            echo "riepilogo email attivo in questo giro"
          else
            echo "nessuna email in questo giro"
          fi

      - name: Ronda
        id: ronda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ronda-notturna.js
      # 12/11/2026 — lo STATO INTERNO esce dal repo pubblico: va su R2 (bucket care-stato),
      # letto da lì dai consumatori (icare-veglia via binding, script via API). Il commit qui
      # resta FINCHÉ tutti i lettori non sono migrati: doppia scrittura, nessun lettore cieco.
      - name: Pubblica lo stato su R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stato-pubblica.mjs qa/ronda-notturna.json --verifica

      # 12/11/2026 — BASTA COMMIT SU qa/ronda-notturna.json: lo stato della ronda vive su R2
      # (caricato sopra) e resta come artefatto del run. Il git non è il posto dello stato.
      - name: Nessun commit dello stato (migrato su R2)
        if: always()
        run: echo "qa/ronda-notturna.json pubblicato su R2, nessun commit sul repo pubblico"

      - name: Artefatto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronda-notturna
          path: qa/ronda-notturna.json
          if-no-files-found: warn
          retention-days: 30
