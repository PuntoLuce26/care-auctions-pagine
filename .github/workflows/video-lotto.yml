name: video-lotto
# Video cinematico dalle foto di un lotto (V0). NON si chiama 3D: niente depth, solo Ken Burns.
#
# Input: lottoId. Foto dai NOSTRI endpoint (/api/pvp-documenti, /api/pvp-img), render con ffmpeg
# PINNATO (la stessa build statica dell'esecutore A: drawtext, zoompan e xfade garantiti), output
# SOLO su R2 `care-stato` sotto video/<id>/ — nessun file nel repo pubblico.
#
# Regole del prodotto: nessuna musica (licenze), nessun volto di persone, nessun logo di terzi;
# se le foto utilizzabili sono meno di 3 il giro esce 0 con {esito:'foto-insufficienti'}.
on:
  workflow_dispatch:
    inputs:
      lottoId:
        description: 'ID del lotto (es. 1822566)'
        required: true
        type: string
      minLato:
        description: 'Soglia lato corto per le FOTO degli allegati (default 560 = regola di prodotto)'
        required: false
        type: string
        default: '560'

permissions:
  contents: read

concurrency:
  group: video-lotto-${{ github.event.inputs.lottoId }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: poppler-utils (pdfimages per le immagini delle perizie)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfimages -v 2>&1 | head -n 1

      - name: ffmpeg PINNATO (stessa build dell'esecutore A)
        run: |
          set -euo pipefail
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-14-12-37/ffmpeg-n8.1.3-35-gf1acb0a266-linux64-gpl-8.1.tar.xz"
          FFMPEG_SHA256="b8277443ba6332534c1cdb272f7bfa8322905f22d08208f5db0b56bc17b5fb3e"
          curl -fsSL --retry 3 --retry-delay 2 "$FFMPEG_URL" -o /tmp/ffmpeg-pin.tar.xz
          echo "$FFMPEG_SHA256  /tmp/ffmpeg-pin.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg-pin"
          tar -xJf /tmp/ffmpeg-pin.tar.xz -C "$HOME/ffmpeg-pin" --strip-components=1
          echo "$HOME/ffmpeg-pin/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ffmpeg-pin/bin:$PATH"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Genera i due video e pubblicali su R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOTTO_ID: ${{ github.event.inputs.lottoId }}
        run: |
          set -euo pipefail
          export PATH="$HOME/ffmpeg-pin/bin:$PATH"
          node scripts/video-lotto.mjs "$LOTTO_ID"

      # ────────────────────────────────────────────────────────────────────────────────────────
      # VOCE ITALIANA (18/11/2026) — Piper it_IT, PINNATO (versione + sha256, mai «latest»).
      # Workers AI non ha una voce italiana (melotts: en/es/fr/jp/kr/zh · deepgram: inglese), quindi
      # l'italiano passa da qui. L'azione `tts` del worker resta per inglese, test e usi web.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: Piper it_IT PINNATO (binario + voce, sha256 verificato)
        run: |
          set -euo pipefail
          PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz"
          PIPER_SHA256="a50cb45f355b7af1f6d758c1b360717877ba0a398cc8cbe6d2a7a3a26e225992"
          VOCE_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
          VOCE_SHA256="f9b8658aa8c01f8280aa88488f6e7643a639b6225a81514c40440a01f6364a20"
          VOCE_CFG_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
          VOCE_CFG_SHA256="10e46e8534dd2d4051f1534ba6542f189f854454acea44a6d45ff464a83260fa"
          curl -fsSL --retry 3 --retry-delay 2 "$PIPER_URL" -o /tmp/piper.tar.gz
          echo "$PIPER_SHA256  /tmp/piper.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/piper-bin" "$HOME/piper-voce"
          tar -xzf /tmp/piper.tar.gz -C "$HOME/piper-bin" --strip-components=1
          curl -fsSL --retry 3 --retry-delay 2 "$VOCE_URL" -o "$HOME/piper-voce/it_IT-paola-medium.onnx"
          curl -fsSL --retry 3 --retry-delay 2 "$VOCE_CFG_URL" -o "$HOME/piper-voce/it_IT-paola-medium.onnx.json"
          echo "$VOCE_SHA256  $HOME/piper-voce/it_IT-paola-medium.onnx" | sha256sum -c -
          echo "$VOCE_CFG_SHA256  $HOME/piper-voce/it_IT-paola-medium.onnx.json" | sha256sum -c -
          chmod +x "$HOME/piper-bin/piper"
          "$HOME/piper-bin/piper" --version 2>&1 | head -n 2 || true

      - name: Voce italiana + mux audio/video + ripubblicazione su R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOTTO_ID: ${{ github.event.inputs.lottoId }}
        run: |
          set -euo pipefail
          export PATH="$HOME/ffmpeg-pin/bin:$PATH"
          export PIPER_DIR="$HOME/piper-bin"
          export VOICE="$HOME/piper-voce/it_IT-paola-medium.onnx"
          node scripts/video-voce.mjs "$LOTTO_ID"

      - name: Artefatto voce (campione 15 s + meta, per l'ascolto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-voce
          path: |
            video-out/campione-15s.wav
            video-out/voce-meta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Riepilogo e meta nell artefatto — i video restano su R2
        if: always()
        run: |
          if [ -f video-out/meta.json ]; then
            cat video-out/meta.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -la video-out/*.mp4 >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nessun meta.json prodotto" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Artefatto (solo meta.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-lotto-meta
          path: video-out/meta.json
          if-no-files-found: warn
          retention-days: 30
