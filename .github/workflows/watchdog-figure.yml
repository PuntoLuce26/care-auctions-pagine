name: watchdog figure -> rerender

# Quando un feed di cifre cambia, le pagine salvate restano indietro e il build
# di Emergent si ferma (15/11: confronto-mercato 40,7% -> 40,5%).
# Questo watchdog scatta al cambio del file e chiede il rerender.

on:
  push:
    paths:
      - 'feed/confronto-mercato.json'
      - 'feed/statistiche.json'
      - 'feed/careindex-serie.json'
      - 'feed/esiti-statistiche.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog-figure
  cancel-in-progress: false

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Elenca i workflow e trova prerender
        id: trova
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows" -o /tmp/wf.json
          echo "workflow trovati: $(wc -c < /tmp/wf.json) byte"
          ID=$(grep -o '"id":[0-9]*,"node_id":"[^"]*","name":"[^"]*","path":"[^"]*prerender[^"]*"' /tmp/wf.json | head -1 | grep -o '[0-9]*' | head -1 || true)
          if [ -z "$ID" ]; then ID=404415738; echo "id noto in uso"; fi
          echo "id=$ID"
          echo "id=$ID" >> $GITHUB_OUTPUT

      - name: Chiedi il rerender
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.trova.outputs.id }}
        run: |
          CODE=$(curl -sS -o /tmp/risp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/$ID/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $CODE"
          cat /tmp/risp.json || true
          if [ "$CODE" != "204" ]; then echo "::error::dispatch rifiutato HTTP $CODE"; exit 1; fi
