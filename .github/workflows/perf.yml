name: perf-qa
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: perf-qa
  cancel-in-progress: false
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test carico e performance
        run: node scripts/perf-test.js
      # 12/11/2026 — lo STATO INTERNO esce dal repo pubblico: va su R2 (bucket care-stato),
      # letto da lì dai consumatori (icare-veglia via binding, script via API). Il commit qui
      # resta FINCHÉ tutti i lettori non sono migrati: doppia scrittura, nessun lettore cieco.
      - name: Pubblica lo stato su R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stato-pubblica.mjs perf/stato.json --verifica
      - name: Commit perf
        if: always()
        shell: bash
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add perf
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "perf: carico e performance ($(date -u +%FT%TZ))"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null; if git push; then exit 0; fi; sleep 4; done
          exit 1
