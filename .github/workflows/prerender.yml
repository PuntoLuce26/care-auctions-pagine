name: prerender
# 5.989 — PAGINE PRONTE SEMPRE FRESCHE, IN CLOUD, SENZA MAC.
# Emergent non puo' rigenerarle (la loro macchina non ha Chrome). Qui invece Chrome c'e':
# si apre l ORIGINE (non il nostro dominio, che serve gli snapshot: sarebbe un circolo vizioso) con un browser vero, si salva l'HTML renderizzato delle 12 rotte e lo si
# committa in prerender/<rotta>.html. L'edge serve questi file (freschi, ogni giorno).
on:
  schedule:
    - cron: "40 3 * * *" # ogni giorno alle 03:40 UTC (04:40 in Italia)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prerender
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        run: |
          npm i -D playwright@1.47.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Cattura le pagine pronte
        run: |
          mkdir -p prerender
          node - <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const ROTTE = [['/', 'index'], ['/ca-re-index','ca-re-index'], ['/osservatorio','osservatorio'],
            ['/esiti','esiti'], ['/andamento-prezzi','andamento-prezzi'], ['/metodo','metodo'],
            ['/icommunity','icommunity'], ['/mappa-prezzi','mappa-prezzi'], ['/indice','indice'],
            ['/aste-aziende','aste-aziende'], ['/idati','idati'], ['/icarewall','icarewall'], ['/aggiudicazioni','aggiudicazioni'], ['/simulatore','simulatore'], ['/aste-private','aste-private'], ['/ihouse','ihouse'], ['/chi-siamo','chi-siamo'], ['/contatti','contatti'], ['/sconto-reale-certificato','sconto-reale-certificato'],
            ['/patto-semplice','patto-semplice'], ['/api-dati','api-dati'], ['/capitali','capitali'],
            ['/case-modulari','case-modulari'], ['/catalunya','catalunya'], ['/pratica-ca-re','pratica-ca-re'], ['/fondatore','fondatore']];
          (async () => {
            const b = await chromium.launch({ headless: true });
            let ok = 0;
            for (const [rotta, slug] of ROTTE) {
              const ctx = await b.newContext({ viewport: { width: 1440, height: 900 }, locale: 'it-IT' });
              const p = await ctx.newPage();
              try {
                // 27/11/2026 — la parete la filtra il NOSTRO edge su /api/battito: se si cattura
                // dall'origine Emergent il filtro non passa e lo snapshot si riporta dietro i pensieri-fatto.
                // Per /icarewall si cattura dal dominio pubblico, così l'app chiama careauctions.co/api/battito (filtrato).
                const BASE_CATTURA = rotta === '/icarewall' ? 'https://careauctions.co' : 'https://care-aste.emergent.host';
                await p.goto(BASE_CATTURA + rotta, { waitUntil: 'load', timeout: 45000 });
                await p.waitForTimeout(5000);
                const html = await p.evaluate(() => '<!DOCTYPE html>\n' + document.documentElement.outerHTML);
                const sez = await p.evaluate(() => document.querySelectorAll('section').length);
                if (html.length > 8000) { // 5.996: accetta anche pagine senza <section> (es. /osservatorio), basta che abbiano contenuto
                  fs.writeFileSync('prerender/' + slug + '.html', html);
                  console.log(slug, 'ok', html.length, 'byte,', sez, 'sezioni');
                  ok++;
                } else console.log(slug, 'SCARTATO', html.length, 'byte', sez, 'sezioni');
              } catch (e) { console.log(slug, 'errore', String(e.message).slice(0, 60)); }
              await ctx.close();
            }
            await b.close();
            fs.writeFileSync('prerender/_ok', String(ok));
            if (ok < 6) process.exit(1);
          })();
          JS
      - name: Rigenera la shell statica (scheletro dell'app)
        run: |
          node - <<'JS'
          const fs = require('fs');
          (async () => {
            const r = await fetch('https://care-aste.emergent.host/');
            if (!r.ok) { console.error('origine non raggiungibile', r.status); process.exit(1); }
            const h = await r.text();
            const i = h.indexOf('<head>'), j = h.indexOf('</head>');
            if (i < 0 || j < 0) { console.error('head non trovato'); process.exit(1); }
            const head = h.slice(i, j + 7);
            const shell = '<!DOCTYPE html><html lang="it">' + head +
              '<body><noscript><p>CARe Auctions · careauctions.co</p><p>Attiva JavaScript per usare il sito.</p></noscript><div id="root"></div></body></html>';
            if (!/main\.[a-f0-9]{8}\.js/.test(shell)) { console.error('bundle non trovato nella shell'); process.exit(1); }
            fs.mkdirSync('shell', { recursive: true });
            fs.writeFileSync('shell/app.html', shell);
            console.log('shell/app.html', shell.length, 'byte');
          })();
          JS

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add prerender shell
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "prerender: pagine pronte rigenerate ($(date -u +%FT%TZ))"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null
            if git push; then exit 0; fi
            sleep 4
          done
          echo "::error::push fallito"; exit 1


      - name: QA dopo la pubblicazione (gate sulla build + debounce 30 min)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 18/11/2026 — GATE SULLA BUILD: il dispatch `emergent-published` esiste per verificare una
          # PUBBLICAZIONE, quindi parte solo se la build servita è cambiata rispetto all'ultima QA
          # conclusa. Vale SOLO per questo dispatch: lo `schedule` resta com'è, perché serve a
          # controllare anche feed e contenuti che cambiano senza una build nuova.
          # 18/11/2026 — la home NON espone sempre il bundle nell'HTML statico (l'app lo carica dopo):
          # si provano più pagine e si prende la prima che lo cita. Misurato: /idati lo cita sempre.
          SERVITA=""
          for P in / /idati /osservatorio /aggiudicazioni; do
            SERVITA=$(curl -sS -H 'User-Agent: careauctions-gate/1.0' "https://careauctions.co$P" | grep -o 'main\.[A-Za-z0-9_-]*\.js' | head -1 || true)
            [ -n "$SERVITA" ] && break
          done
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "$SERVITA" ]; then
            ULTIMA=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/d5d20864ee7f83c32c9eeb5fcbda6edb/r2/buckets/care-stato/objects/stato/qa/stato.json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.build&&j.build.sito)||"")}catch(e){console.log("")}})' || true)
            echo "build servita: $SERVITA · ultima QA: ${ULTIMA:-nessuna}"
            if [ "$SERVITA" = "$ULTIMA" ]; then
              echo "build invariata dall'ultima QA: salto il dispatch (una pubblicazione non c'è stata)"
              exit 0
            fi
          else
            echo "gate sulla build non applicabile (token o build mancanti): si passa al debounce"
          fi
          ULTIMO=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qa.yml/runs?status=completed&per_page=1" \
            | jq -r '.workflow_runs[0].created_at // empty')
          if [ -n "$ULTIMO" ]; then
            ETA=$(( ( $(date -u +%s) - $(date -u -d "$ULTIMO" +%s) ) / 60 ))
            echo "ultimo QA: $ULTIMO (${ETA} min fa)"
            if [ "$ETA" -lt 30 ]; then echo "QA recente: salto il dispatch"; exit 0; fi
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"emergent-published"}' -o /tmp/qa-dispatch.json -w "QA dispatch HTTP %{http_code}\n"
          head -c 200 /tmp/qa-dispatch.json || true
