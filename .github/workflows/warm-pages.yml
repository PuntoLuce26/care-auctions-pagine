name: warm-pages
# 8/11 — ridotto per non sovraccaricare l'app (alert "severe performance issues" di Emergent):
# ogni 3 ore, solo le prime 8 città/tribunali. L'app non deve andare in sofferenza per il warm.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the app SSR (long timeout) and the edge (bot)
        run: |
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          set -- milano roma torino napoli bari firenze bologna palermo
          for c in "$@"; do curl -s -o /dev/null -m 120 "https://care-aste.emergent.host/api/pagine/aste-tribunale/it/$c.html"; done
          for c in "$@"; do curl -s -o /dev/null -m 60 "https://care-aste.emergent.host/api/pagine/case-asta-$c"; done
          for c in "$@"; do curl -s -o /dev/null -m 40 -A "$UA" "https://careauctions.co/aste-tribunale/it/$c.html"; done
          for c in "$@"; do curl -s -o /dev/null -m 40 -A "$UA" "https://careauctions.co/case-asta-$c"; done
