name: feed-sync
on:
  schedule:
    - cron: '*/5 * * * *'   # incrementale
    - cron: '0 1 * * *'      # notturna completa + prezzi IVG
  workflow_dispatch:
    inputs:
      mode:
        description: 'inc (incrementale) oppure full (raccolta completa)'
        required: false
        default: 'inc'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sync (inc ogni 15 min, full + IVG all'01:00 UTC)
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event.inputs.mode }}" = "full" ] || [ "$H" = "01" ]; then MODE=full; else MODE=inc; fi
          echo "MODE=$MODE"
          MODE=$MODE node scripts/sync-feed.js
          node scripts/dati-indice.js || echo "indice dati: non aggiornato"
          node scripts/numeri-vivi.js || echo "numeri vivi: non rigenerati in questo giro"
          node scripts/statistiche-mercato.js || echo "statistiche mercato: non aggiornate in questo giro"
          node scripts/idmap-sitemap.js || echo "idmap/citymap/sitemap: non rigenerati in questo giro"
          # 5.915: report mensile certificato, una volta al giorno (ore 02 UTC)
          if [ "$H" = "02" ]; then node scripts/report-mensile.js || echo "report mensile: non generato"; fi
          if [ "$MODE" = "full" ]; then
            node scripts/ivg-aggiudicazioni.js || echo "IVG: raccolta non riuscita stasera"
            node scripts/fallco-aggiudicazioni.js || echo "FALLCO: raccolta non riuscita stasera"
            # 9/11/2026 - l'archivio dei prezzi NON si sovrascrive piu': prima l'ultimo
            # scrittore (IVG) rimpiazzava tutto e, se la raccolta era vuota, lasciava
            # feed/aggiudicazioni.json = [] (i 16.771 prezzi sono spariti il 9/11 alle 01:58Z).
            # Ora si UNISCE per fonte|id e un array vuoto non si scrive: scripts/aggiudicazioni-merge.js
            node scripts/aggiudicazioni-merge.js fallco /tmp/aggiudicazioni-fallco.json || echo "FALLCO: archivio aggiudicazioni intatto"
            node scripts/aggiudicazioni-merge.js ivg /tmp/aggiudicazioni-ivg.json || echo "IVG: archivio aggiudicazioni intatto"
          fi
      - name: commit e push
        run: |
          git config user.name "Sam CARe"
          git config user.email "sam@careauctions.co"
          git add feed/ sitemap-locali.xml report-*.html report-*.json
          if git diff --cached --quiet; then echo "nessuna variazione"; else
            git commit -m "Feed sync $MODE $(date -u +%FT%TZ)"
            # race-safe 5.838: il Mac e il cloud scrivono sullo stesso repo → pull con rebase + retry
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main 2>/dev/null || { git rebase --abort 2>/dev/null; true; }
              if git push; then break; fi
              sleep 4
            done
          fi
