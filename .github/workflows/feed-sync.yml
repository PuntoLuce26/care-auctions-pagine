name: feed-sync
on:
  schedule:
    - cron: '*/15 * * * *'   # incrementale
    - cron: '0 1 * * *'      # notturna completa + prezzi IVG
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sync (inc ogni 15 min, full + IVG all'01:00 UTC)
        run: |
          H=$(date -u +%H)
          if [ "$H" = "01" ]; then MODE=full; else MODE=inc; fi
          echo "MODE=$MODE"
          MODE=$MODE node scripts/sync-feed.js
          node scripts/dati-indice.js || echo "indice dati: non aggiornato"
          node scripts/statistiche-mercato.js || echo "statistiche mercato: non aggiornate in questo giro"
          if [ "$MODE" = "full" ]; then
            node scripts/ivg-aggiudicazioni.js || echo "IVG: raccolta non riuscita stasera"
            node scripts/fallco-aggiudicazioni.js || echo "FALLCO: raccolta non riuscita stasera"
            node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/aggiudicazioni-fallco.json','utf8'));const v=j.voci||[];const out=v.map(x=>({id:String(x.id),descrizione:(x.descrizione||'').slice(0,140),prezzo:x.prezzo_numero,prezzo_label:x.prezzo_label||'',termina:(x.termine||'').slice(0,10),ivg:x.ivg||'',tribunale:x.tribunale||'',fonte:'fallcoaste'}));fs.writeFileSync('feed/aggiudicazioni.json',JSON.stringify(out));console.log('aggiudicazioni.json:',out.length);}catch(e){console.log('FALLCO: nessun dato');}"
            node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/aggiudicazioni-ivg.json','utf8'));const v=j.filter(x=>x.venduto&&x.prezzo).map(x=>({id:x.id,titolo:x.titolo,prezzo:x.prezzo,url:x.url,fonte:'ivg'}));fs.writeFileSync('feed/aggiudicazioni.json',JSON.stringify(v));console.log('aggiudicazioni.json:',v.length);}catch(e){console.log('IVG: nessun dato da pubblicare');}"
          fi
      - name: commit e push
        run: |
          git config user.name "Sam CARe"
          git config user.email "sam@careauctions.co"
          git add feed/
          if git diff --cached --quiet; then echo "nessuna variazione"; else
            git commit -m "Feed sync $MODE $(date -u +%FT%TZ)"
            # race-safe 5.838: il Mac e il cloud scrivono sullo stesso repo → pull con rebase + retry
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null
              if git push; then break; fi
              sleep 4
            done
          fi
