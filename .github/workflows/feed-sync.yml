name: feed-sync
on:
  schedule:
    # 9/11/2026 - la cadenza dichiarata conta poco: e' la sentinella del worker che
    # dispatcha questo workflow ogni ~3 minuti. Il freno vero sta nel passo di commit
    # (max un commit ogni 5 minuti), perche' il deploy di GitHub Pages dura 130-240 s
    # e ogni commit nuovo cancellava la build in corso (5 riuscite su 30 in un'ora).
    - cron: '*/5 * * * *'   # incrementale
    - cron: '0 1 * * *'      # notturna completa + prezzi IVG
  workflow_dispatch:
    inputs:
      mode:
        description: 'inc (incrementale) oppure full (raccolta completa)'
        required: false
        default: 'inc'
permissions:
  contents: write
# 9/11/2026 - un giro alla volta: due raccolte in parallelo si sovrascrivevano i file
concurrency:
  group: feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sync (inc ogni 15 min, full + IVG all'01:00 UTC)
        run: |
          H=$(date -u +%H)
          # 10/11/2026 - SOLO il cron notturno '0 1 * * *' fa la raccolta completa.
          # Prima la condizione era [ "$H" = "01" ]: qualunque run partito fra le 01:00 e le
          # 01:59 UTC (anche i dispatch della sentinella ogni ~3 min) faceva una full da ~56
          # minuti, quindi la notte si incatenavano due full e il feed restava fermo ~2 ore.
          MODE_IN='${{ github.event.inputs.mode }}'
          SCHED='${{ github.event.schedule }}'
          if [ "$MODE_IN" = "full" ]; then
            MODE=full
          elif [ "$MODE_IN" = "inc" ]; then
            MODE=inc
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$SCHED" = "0 1 * * *" ]; then
            MODE=full
          else
            MODE=inc
          fi
          echo "MODE=$MODE (evento ${{ github.event_name }}, cron '$SCHED', input '$MODE_IN')"
          MODE=$MODE node scripts/sync-feed.js
          node scripts/dati-indice.js || echo "indice dati: non aggiornato"
          node scripts/numeri-vivi.js || echo "numeri vivi: non rigenerati in questo giro"
          node scripts/statistiche-mercato.js || echo "statistiche mercato: non aggiornate in questo giro"
          node scripts/idmap-sitemap.js || echo "idmap/citymap/sitemap: non rigenerati in questo giro"
          # 5.915: report mensile certificato, una volta al giorno (ore 02 UTC)
          if [ "$H" = "02" ]; then node scripts/report-mensile.js || echo "report mensile: non generato"; fi
          if [ "$MODE" = "full" ]; then
            node scripts/ivg-aggiudicazioni.js || echo "IVG: raccolta non riuscita stasera"
            node scripts/fallco-aggiudicazioni.js || echo "FALLCO: raccolta non riuscita stasera"
            # 9/11/2026 - l'archivio dei prezzi NON si sovrascrive piu': prima l'ultimo
            # scrittore (IVG) rimpiazzava tutto e, se la raccolta era vuota, lasciava
            # feed/aggiudicazioni.json = [] (i 16.771 prezzi sono spariti il 9/11 alle 01:58Z).
            # Ora si UNISCE per fonte|id e un array vuoto non si scrive: scripts/aggiudicazioni-merge.js
            node scripts/aggiudicazioni-merge.js fallco /tmp/aggiudicazioni-fallco.json || echo "FALLCO: archivio aggiudicazioni intatto"
            node scripts/aggiudicazioni-merge.js ivg /tmp/aggiudicazioni-ivg.json || echo "IVG: archivio aggiudicazioni intatto"
          fi
      - name: commit e push
        run: |
          git config user.name "Sam CARe"
          git config user.email "sam@careauctions.co"
          # 9/11/2026 - FRENO SUL COMMIT. Il deploy di GitHub Pages impiega 130-240 s e
          # ogni commit nuovo CANCELLA la build in corso: la sentinella del worker
          # dispatcha feed-sync ogni ~3 minuti, quindi il sito restava fermo all'ultima
          # build buona (misurato: 5 build riuscite su 30 in un'ora, e il ripristino dei
          # prezzi di aggiudicazione e' rimasto invisibile per 10 minuti).
          # Qui si committa al massimo ogni 5 minuti; il giro full notturno committa sempre.
          # Non si perde niente: il giro successivo rilegge il feed e riaggiunge i lotti.
          if [ "$MODE" != "full" ]; then
            ULTIMO=$(git log -1 --format=%ct)
            ADESSO=$(date +%s)
            ATTESO=$((ADESSO - ULTIMO))
            if [ "$ATTESO" -lt 300 ]; then
              echo "commit saltato: ultimo commit ${ATTESO}s fa (soglia 300s) — lascio finire il deploy Pages"
              exit 0
            fi
          fi
          git add feed/ sitemap-locali.xml report-*.html report-*.json
          if git diff --cached --quiet; then echo "nessuna variazione"; else
            git commit -m "Feed sync $MODE $(date -u +%FT%TZ)"
            # race-safe 5.838: il Mac e il cloud scrivono sullo stesso repo → pull con rebase + retry
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main 2>/dev/null || { git rebase --abort 2>/dev/null; true; }
              if git push; then break; fi
              sleep 4
            done
          fi
