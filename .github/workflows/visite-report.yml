name: visite-report
# Il software che guarda il sito e ne parla due volte al giorno:
# visite e pagine viste (Cloudflare RUM), doppie percentuali (vs report precedente e vs giorno prima),
# valore costruito, valore della societa' oggi e proiezione a 5 anni. Scrive visite/stato.json + QUADRO.md e manda l'email.
on:
  schedule:
    - cron: "0 8,20 * * *"   # 09:00 e 21:00 ora italiana
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visite-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rapporto visite
        env:
          REGIA_KEY: ${{ secrets.REGIA_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/visite-report.js
      - name: Committa lo stato delle visite
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add visite
          git diff --cached --quiet && echo "nessuna variazione" && exit 0
          git commit -m "visite: rapporto $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null
            if git push; then exit 0; fi
            sleep 4
          done
          echo "::error::push fallito"; exit 1
