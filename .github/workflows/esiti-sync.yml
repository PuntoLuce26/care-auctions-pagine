name: esiti-sync
# Prezzi di aggiudicazione pubblici (FallcoAste, Notarile Verona, AstaGiudiziaria/IVG):
# li normalizza, calcola CAReIndex/iDati/CAReOS e aggiorna i feed. La copertura è dichiarata.
on:
  schedule:
    - cron: "0 3,15 * * *"   # 11/11/2026: due giri al giorno (03:00 e 15:00 UTC) per esiti piu freschi
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: esiti-sync
  cancel-in-progress: false
jobs:
  esiti:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Raccogli i prezzi pubblici (FallcoAste)
        run: node scripts/fallco-aggiudicazioni.js
      # 10/11/2026 (turno posta/allarmi) — il run delle 20:21Z è rimasto 50+ minuti su
      # questo passo: /tmp è effimero sul runner, quindi la cache del crawl non esisteva e
      # ogni giro ricrawlava tutte le 7.315 inserzioni. Con la cache la cartella resta fra
      # un run e l'altro; il budget (AGG_IVG_BUDGET_MIN) chiude il giro invece di correre
      # fino al timeout del job, e continue-on-error lascia comunque normalizzare i feed.
      - name: Cache prezzi IVG (incrementale fra un giro e l'altro)
        uses: actions/cache@v4
        with:
          path: /tmp/aggiudicazioni-ivg
          key: ivg-aggiudicazioni-${{ github.run_id }}
          restore-keys: |
            ivg-aggiudicazioni-
      - name: Raccogli i prezzi pubblici (AstaGiudiziaria/IVG)
        timeout-minutes: 25
        continue-on-error: true
        env:
          AGG_IVG_DIR: /tmp/aggiudicazioni-ivg
          AGG_IVG_OUT: /tmp/aggiudicazioni-ivg.json
          AGG_IVG_BUDGET_MIN: "20"
        run: node scripts/ivg-aggiudicazioni.js
      - name: Normalizza, calcola indici e aggiorna i feed
        run: node scripts/esiti-sync.js
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add feed
          # 12/11/2026 — feed/statistiche.json lo scrive il feed-sync (ogni pochi minuti):
          # committarlo qui produceva CONFLICT + non-fast-forward a ogni giro.
          git reset -q HEAD feed/statistiche.json 2>/dev/null || true
          git checkout -- feed/statistiche.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "esiti: prezzi aggiudicazione e indici ($(date -u +%FT%TZ))"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main; then
              if git push; then exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 8
          done
          echo "::error::push esiti non riuscito dopo 5 tentativi"
          exit 1
