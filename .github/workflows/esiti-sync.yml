name: esiti-sync
# Prezzi di aggiudicazione pubblici (FallcoAste, Notarile Verona, AstaGiudiziaria/IVG):
# li normalizza, calcola CAReIndex/iDati/CAReOS e aggiorna i feed. La copertura è dichiarata.
#
# 13/11/2026 — IL GIRO LASCIA UNA TRACCIA A OGNI PASSAGGIO, ANCHE QUANDO NON C'È NIENTE DI NUOVO.
# Il guasto misurato: `feed/aggiudicazioni.json` è un array nudo di 3,8 MB senza campo di tempo,
# quindi un giro verde con «nessuna variazione» e un processo FERMO producono lo stesso segnale
# (la data di commit del file). Per 24 ore il feed è sembrato rotto mentre il workflow girava.
# Ora ogni giro scrive `feed/esiti-stato.json` con {ultimoGiro, record, fonte, esito, durataMin}
# e lo pubblica su R2 (`stato/esiti/stato.json`, bucket `care-stato`): è uno STATO INTERNO,
# non un feed del sito (nessun file nuovo in `/feed/` pubblico). La veglia `icare-veglia`
# sorveglia QUEL file, non la data di commit di un array.
on:
  schedule:
    - cron: "0 3,15 * * *"   # 11/11/2026: due giri al giorno (03:00 e 15:00 UTC) per esiti piu freschi
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: esiti-sync
  cancel-in-progress: false
jobs:
  esiti:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 13/11/2026 — l'ora di partenza serve a `durataMin` nel file di stato. È l'orologio del
      # runner (date -u), non quello di GitHub.
      - name: Inizio del giro (per durataMin)
        run: echo "ESITI_INIZIO=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      # 13/11/2026 — IL RUN PARTE DAL MAIN PIÙ RECENTE, NON DAL COMMIT DELL'EVENTO.
      # `actions/checkout` porta il tree del commit che ha triggerato la run: se è vecchio di
      # decine di minuti, i file `feed/esiti-*.json` (che un altro esiti-sync rigenera OGNI giro)
      # arrivano già superati e il `git pull --rebase` trova CONFLICT su ca-re-index-esiti.json,
      # esiti-report.json ed esiti-statistiche.json → «push esiti non riuscito dopo 5 tentativi»
      # (misurato sul run 43402314383 del 13/11: 3 file in conflitto, job rosso, derivati fermi
      # mentre i dati erano stati raccolti bene). Allinearsi PRIMA di generare non nasconde
      # niente: i derivati si rigenerano dai dati freschi e il commit resta un fast-forward.
      - name: Allinea al main più recente (la base del run non deve essere vecchia)
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          git log --oneline -1
      - name: Raccogli i prezzi pubblici (FallcoAste)
        run: node scripts/fallco-aggiudicazioni.js
      # 10/11/2026 (turno posta/allarmi) — il run delle 20:21Z è rimasto 50+ minuti su
      # questo passo: /tmp è effimero sul runner, quindi la cache del crawl non esisteva e
      # ogni giro ricrawlava tutte le 7.315 inserzioni. Con la cache la cartella resta fra
      # un run e l'altro; il budget (AGG_IVG_BUDGET_MIN) chiude il giro invece di correre
      # fino al timeout del job, e continue-on-error lascia comunque normalizzare i feed.
      - name: Cache prezzi IVG (incrementale fra un giro e l'altro)
        uses: actions/cache@v4
        with:
          path: /tmp/aggiudicazioni-ivg
          key: ivg-aggiudicazioni-${{ github.run_id }}
          restore-keys: |
            ivg-aggiudicazioni-
      - name: Raccogli i prezzi pubblici (AstaGiudiziaria/IVG)
        timeout-minutes: 25
        continue-on-error: true
        env:
          AGG_IVG_DIR: /tmp/aggiudicazioni-ivg
          AGG_IVG_OUT: /tmp/aggiudicazioni-ivg.json
          AGG_IVG_BUDGET_MIN: "20"
        run: node scripts/ivg-aggiudicazioni.js
      - name: Normalizza, calcola indici e aggiorna i feed
        id: normalizza
        run: node scripts/esiti-sync.js
      - name: Commit e push
        id: commit
        shell: bash
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add feed
          # 12/11/2026 — feed/statistiche.json lo scrive il feed-sync (ogni pochi minuti):
          # committarlo qui produceva CONFLICT + non-fast-forward a ogni giro.
          git reset -q HEAD feed/statistiche.json 2>/dev/null || true
          git checkout -- feed/statistiche.json 2>/dev/null || true
          # 12/11/2026 — il conflitto vero era su esiti-monitor.json, non su statistiche.json:
          # il fix dell'11/11 copriva solo il primo file e il push falliva dopo 5 tentativi.
          git reset -q HEAD feed/esiti-monitor.json 2>/dev/null || true
          git checkout -- feed/esiti-monitor.json 2>/dev/null || true
          git reset -q HEAD feed/andamento-esiti.json 2>/dev/null || true
          git checkout -- feed/andamento-esiti.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "esiti: prezzi aggiudicazione e indici ($(date -u +%FT%TZ))"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main; then
              if git push; then exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 8
          done
          echo "::error::push esiti non riuscito dopo 5 tentativi"
          exit 1
      # ═════════════════════════════════════════════════════════════════════════════════
      # IL FILE DI STATO DEL GIRO — scritto SEMPRE: anche quando il commit non ha trovato
      # niente da committare («nessuna variazione») e anche quando il giro è fallito (in quel
      # caso dichiara l'errore e NON fa avanzare `ultimoGiro`: la veglia deve continuare a
      # vederlo fermo, non finto-fresco).
      # Sta DOPO il commit di proposito: così non entra mai nel repo (non è prodotto) e non
      # può finire nel `git add feed`.
      # ═════════════════════════════════════════════════════════════════════════════════
      - name: Stato del giro (feed/esiti-stato.json)
        if: always()
        env:
          ESITO_NORMALIZZA: ${{ steps.normalizza.outcome }}
          ESITO_COMMIT: ${{ steps.commit.outcome }}
          # servono a LEGGERE lo stato del giro precedente da R2 (`--leggi`): senza token il
          # confronto resta null e il file direbbe «giro-eseguito» a ogni giro — cioè non
          # distinguerebbe più «nuovi record» da «niente di nuovo», che è il suo scopo.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # il giro precedente serve a distinguere «nuovi record» da «niente di nuovo»:
          # si legge da R2 (se il secret manca il confronto resta null = «non so», mai zero)
          node scripts/stato-pubblica.mjs --leggi esiti/stato.json > /tmp/esiti-stato-precedente.json 2>/tmp/esiti-stato-precedente.err || true
          if [ -s /tmp/esiti-stato-precedente.err ]; then echo "::notice::stato precedente non letto: $(head -c 160 /tmp/esiti-stato-precedente.err)"; fi
          node scripts/esiti-stato.mjs --precedente /tmp/esiti-stato-precedente.json
          echo "── feed/esiti-stato.json ──"
          cat feed/esiti-stato.json
      - name: Stato su R2 (stato interno, NON un feed pubblico)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -s feed/esiti-stato.json ]; then echo "::warning::nessun file di stato da pubblicare (lo step precedente è rosso: guarda quello)"; exit 0; fi
          node scripts/stato-pubblica.mjs feed/esiti-stato.json --chiave esiti/stato.json --verifica
      - name: Artefatto del giro (la prova scaricabile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esiti-stato
          path: |
            feed/esiti-stato.json
            feed/esiti-statistiche.json
          retention-days: 7
          if-no-files-found: warn
