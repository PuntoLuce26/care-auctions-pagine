name: "Iscritti - solo numeri (redatto)"
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["qa", "verifica-pubblicazione", "icare-test", "run-riassunto"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: iscritti
  cancel-in-progress: false
jobs:
  iscritti:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Genera i numeri
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/iscritti.mjs
      - name: Commit
        run: |
          git config user.name "careauctions-bot"
          git config user.email "info@puntoluce26.com"
          git add qa/iscritti.json qa/RUN.md
          git diff --staged --quiet || git commit -m "iscritti: numeri redatti $(date -u +%FT%TZ)"
          # 28/11/2026 — il remoto si muove ogni pochi minuti (feed-sync): pull --rebase e 5 tentativi,
          # altrimenti il push viene rifiutato con "fetch first" e il file non entra (run rossi del 27/11).
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin main || git rebase --abort || true
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::push rifiutato cinque volte: il file resta nel runner"; exit 1
