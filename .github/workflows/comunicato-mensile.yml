name: comunicato-mensile
# 5.932 — il 1° del mese genera il comunicato CAReIndex (markdown + HTML + PDF) e lo committa.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: comunicato-mensile
  cancel-in-progress: false
jobs:
  comunicato:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Genera comunicato
        run: node scripts/comunicato-mensile.js
      - name: PDF (best effort)
        run: |
          pip install -q weasyprint || true
          MESE=$(date -u +%Y-%m)
          weasyprint "comunicati/$MESE.html" "comunicati/$MESE.pdf" 2>/dev/null || echo "PDF non generato"
      - name: Commit e push
        shell: bash
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          git add comunicati/
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "comunicato CAReIndex: $(date -u +%Y-%m)"
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null
            if git push; then ok=1; break; fi
            sleep 4
          done
          if [ "$ok" != "1" ]; then echo "::error::push fallito"; exit 1; fi
