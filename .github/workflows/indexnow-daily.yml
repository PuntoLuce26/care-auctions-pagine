name: indexnow-daily
# 5.9 — bombardamento quotidiano: sitemap -> IndexNow (Bing, Yandex, Seznam...)
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invia a IndexNow fino a 10.000 URL (rotazione giornaliera)
        run: node scripts/indexnow-daily.mjs
