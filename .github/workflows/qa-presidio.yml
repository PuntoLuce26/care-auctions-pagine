name: qa-presidio
# 18/11/2026 — GitHub dirada le schedule: il cron `0 */3 * * *` ha saltato il giro delle 12:00Z
# (ultima run schedulata 08:40Z, poi solo dispatch manuali) e il payload QA è rimasto fermo.
# Quindi: si aggiunge un trigger su push in qa/ e una seconda finestra la sera; in alcuni giorni
# girerà 3-4 volte, ed è accettato.
on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 18 * * *"
  push:
    paths:
      - "qa/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-presidio
  cancel-in-progress: false
jobs:
  presidio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 18/11/2026 — il presidio NON dipende più dal Mac: 51 controlli in cloud, i 7 che richiedono
      # il Mac restano nel presidio locale (careauctions/qa/internal-audit.mjs → qa/audit-mac.json).
      # Il payload `qa/audit-interno.json` lo pubblica questo workflow (un file, un solo scrittore):
      # se non riesce a pubblicarlo, l'audit esce 1 (un verde che non pubblica è peggio di un rosso).
      - name: Presidio QA cloud (51 check) e pubblicazione dello stato
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/audit-cloud.mjs
      - name: Allega il referto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-presidio
          path: careauctions/qa/out/
          if-no-files-found: ignore
