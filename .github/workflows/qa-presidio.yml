name: qa-presidio
on:
  schedule:
    # 18/11/2026 — DUE schedule distinte, a un minuto diverso: GitHub dirada le cron e una sola
    # occorrenza ogni 3 h può saltare (misurato: ultimo run 09:58, payload vecchio di 5 h).
    # Due occasioni indipendenti aumentano la probabilità che almeno una scatti.
    - cron: "0 */3 * * *"
    - cron: "20 */3 * * *"
  # e ogni volta che cambia il presidio stesso: se tocco il codice, il controllo gira subito.
  push:
    paths:
      - "qa/**"
      - ".github/workflows/qa-presidio.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-presidio
  cancel-in-progress: false
jobs:
  presidio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 18/11/2026 — il presidio NON dipende più dal Mac: 51 controlli in cloud, i 7 che richiedono
      # il Mac restano nel presidio locale (careauctions/qa/internal-audit.mjs → qa/audit-mac.json).
      # Il payload `qa/audit-interno.json` lo pubblica questo workflow (un file, un solo scrittore):
      # se non riesce a pubblicarlo, l'audit esce 1 (un verde che non pubblica è peggio di un rosso).
      - name: Presidio QA cloud (51 check) e pubblicazione dello stato
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/audit-cloud.mjs
      - name: Allega il referto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-presidio
          path: careauctions/qa/out/
          if-no-files-found: ignore
