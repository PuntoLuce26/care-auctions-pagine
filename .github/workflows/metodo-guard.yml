name: metodo-guard

# Regola ferma: si pubblica il fatto (numero + perimetro + data + fonte), non il metodo.
# Questo guardiano fallisce se formula, soglie, filtri o "metodo completo" ricompaiono
# sulle pagine pubbliche (sito e origine Emergent).

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metodo-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardia metodo
        run: node scripts/metodo-guard.mjs
