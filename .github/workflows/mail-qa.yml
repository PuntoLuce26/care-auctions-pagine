name: mail-qa
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: mail-qa
  cancel-in-progress: false
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Leggi mail e lancia il QA
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mail-qa.js
      # 12/11/2026 — lo STATO INTERNO esce dal repo pubblico: va su R2 (bucket care-stato),
      # letto da lì dai consumatori (icare-veglia via binding, script via API). Il commit qui
      # resta FINCHÉ tutti i lettori non sono migrati: doppia scrittura, nessun lettore cieco.
      - name: Pubblica lo stato su R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stato-pubblica.mjs mail/stato.json --verifica
      # 12/11/2026 — BASTA COMMIT SU mail/stato.json. Lo stato della posta vive su R2 (bucket
      # care-stato), caricato dallo step qui sopra: 20 commit/24h su questo file, ognuno capace
      # di cancellare la build Pages in corso, e i soggetti delle mail finivano in un repo PUBBLICO.
      # Il file resta nel repo come copia congelata finché non lo si toglie (nessun lettore lo usa
      # più: veglia, ai-sentinel, ronda, stato-unico, orchestra e la sveglia del QA leggono da R2).
      - name: Nessun commit dello stato (migrato su R2)
        run: echo "mail/stato.json pubblicato su R2, nessun commit sul repo pubblico"
