name: qa
# QA CAReAuctions — crawler + form + immagini + link + log + SEO/AI.
# Gira in cloud su GitHub Actions. Non compra, non paga, non invia form.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [emergent-published, qa-run, email-alert, ai-alert]
  push:
    paths:
      - "qa/**"
      - "scripts/verifica-playwright.mjs"
      - ".github/workflows/qa.yml"
      - "prerender/**"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: qa-pw-${{ runner.os }}-1.63.0

      - name: Installa Playwright (Chromium, Firefox, WebKit)
        run: |
          npm i playwright@1.63.0 --no-save
          npx playwright install --with-deps chromium firefox webkit

      - name: QA crawl + log scan
        env:
          QA_BASE: https://careauctions.co
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node qa/run.mjs

      - name: Riepilogo nel run
        if: always()
        run: |
          if [ -f qa/out/summary.md ]; then cat qa/out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Artefatto del report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/out/
          retention-days: 30

      # 12/11/2026 — BASTA COMMIT SU qa/stato.json (27 commit/24h misurati, ognuno capace di
      # cancellare la build Pages in corso). Lo stato si scrive e si pubblica su R2: qui sotto.
      # Il file resta nel repo come copia congelata finché non lo si toglie; i lettori
      # (veglia, ai-sentinel, ronda, stato-unico, orchestra, ai-education, qa-sync) leggono da R2.
      - name: Scrivi lo stato del QA (niente commit)
        if: success()
        run: node qa/status.mjs
      # 12/11/2026 — lo stato del QA esce dal repo pubblico: va su R2 (care-stato) e si legge da lì.
      # Il commit sopra resta finché tutti i lettori non sono migrati (doppia scrittura).
      - name: Pubblica lo stato QA su R2
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stato-pubblica.mjs qa/stato.json --verifica

      - name: Issue GitHub (una sola, aggiornata)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node qa/publish.mjs

      - name: Patch sicura su branch + PR
        if: ${{ vars.QA_AUTOMERGE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s qa/out/patch.diff ]; then echo "Nessuna patch sicura in questo giro."; exit 0; fi
          git config user.name "CARe QA"
          git config user.email "qa@careauctions.co"
          BR="qa/auto-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git apply qa/out/patch.diff
          git add -A
          git commit -m "QA: patch automatica ${GITHUB_RUN_ID}"
          git push origin "$BR"
          gh pr create --title "QA: patch automatica ${GITHUB_RUN_ID}" --body-file qa/out/fix-proposals.md --base main --head "$BR"

      - name: Quality gate (rosso solo per i critici)
        if: always()
        run: node qa/gate.mjs

      - name: Allarme mail -> triage
        if: github.event_name == 'repository_dispatch' && github.event.action == 'email-alert'
        env:
          ALERT_JSON: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/alert.mjs

      - name: Allarme AI -> triage
        if: github.event_name == 'repository_dispatch' && github.event.action == 'ai-alert'
        env:
          AI_ALERT_JSON: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/alert.mjs

      # 10/11/2026 (turno posta/allarmi) — il cron */10 di mail-qa non è stato onorato
      # da GitHub (0 run in 5,5 ore): il monitor posta restava fermo e la catena
      # mail -> qa/alert.mjs non partiva. Se qa gira (schedule 30 min + dispatch di
      # Emergent) e lo stato della posta è vecchio, qa sveglia mail-qa.
      - name: Sveglia mail-qa (se il monitor posta è fermo)
        # 14/11/2026 — DISATTIVATA: era il carburante del circuito qa ⇄ mail-qa.
        # L'orologio della posta è la veglia (icare-veglia), non il QA.
        if: ${{ false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 12/11/2026 — lo stato della posta vive su R2: la sveglia legge da lì (il file nel repo
          # resta solo come ripiego durante la migrazione). Un `require` del file congelato darebbe
          # un'età falsa e sveglierebbe mail-qa a ogni giro: qui si legge la fonte vera.
          ultimo=$(node scripts/stato-pubblica.mjs --leggi mail/stato.json --campo ultimoControllo 2>/dev/null || true)
          if [ -z "$ultimo" ]; then
            ultimo=$(node -e 'try{const j=require("./mail/stato.json");process.stdout.write(String(j.ultimoControllo||""))}catch(e){process.stdout.write("")}')
            echo "R2 non leggibile: ripiego sul file nel repo (migrazione in corso)"
          fi
          if [ -z "$ultimo" ]; then eta=999999; else eta=$(( ( $(date -u +%s) - $(date -u -d "$ultimo" +%s) ) / 60 )); fi
          echo "mail-qa ultimoControllo: ${ultimo:-nessuno} (${eta} min fa)"
          if [ "$eta" -gt 40 ]; then
            gh workflow run mail-qa.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "mail-qa svegliato" || echo "sveglia non riuscita"
          else
            echo "monitor posta fresco: nessuna sveglia"
          fi
