name: rete-doppio-esecutore

# RETE+ — DOPPIO ESECUTORE (il pezzo che rende la ridondanza vera)
#
# Esegue lo STESSO lavoro ffmpeg su due esecutori indipendenti e confronta gli esiti:
#   A) GitHub Actions — ffmpeg del runner (esecutore storico)
#   B) Cloudflare Containers — container `esecutore-b` con ffmpeg (seconda infrastruttura)
#
# Scrive `rete/doppio-esecutore.json`:
#   { eseguito, A:{sha,versione,durataMs}, B:{sha,versione,durataMs}, verdetto, cadenza }
# Verdetto: COERENTE (sha uguali) · INCOERENTE (sha diversi, si dichiara con le due
# versioni di ffmpeg) · B_NON_DISPONIBILE (nessuna ridondanza: 0 esecutori su 2).
#
# Il job FALLISCE (rosso) se l'esecutore B non risponde: con un solo esecutore la
# ridondanza è 0 su 1 e il rosso è l'informazione giusta, non un guasto del workflow.
#
# VERSIONE PINNATA (15/11/2026) — UNA SOLA VERSIONE PER I DUE ESECUTORI:
# l'esecutore A non usa più l'ffmpeg di sistema del runner. Scarica la STESSA build
# statica che il Dockerfile di `esecutore-b` (repo care-workers) mette nel container:
# release BtbN/FFmpeg-Builds con TAG IMMUTABILE per data (autobuild-2026-11-14-12-37),
# `checksums.sha256` pubblicato dentro la release, sha256 verificato prima di usarla.
# Versione: ffmpeg n8.1.3-35-gf1acb0a266-20261114 (variante GPL: serve libx264).
# Se il checksum non torna o la versione non è quella attesa, il passo FALLISCE:
# meglio un giro rosso che una parità solo dichiarata.
#
# Comando:
#   GH_TOKEN=$(cat careauctions/.tools/github-token.txt) gh workflow run rete-doppio-esecutore.yml \
#     -R PuntoLuce26/care-auctions-pagine -f esecutore_b_url=https://esecutore-b.<sub>.workers.dev

on:
  workflow_dispatch:
    inputs:
      esecutore_b_url:
        description: 'URL base dell esecutore B (vuoto = si usa rete/esecutore-b.json)'
        type: string
        required: false
        default: ''
  schedule:
    # una volta al giorno; la cadenza dichiarata nel referto è questa
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: rete-doppio-esecutore
  cancel-in-progress: false

jobs:
  doppio:
    name: A (actions) vs B (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ESECUTORE_B_URL: ${{ inputs.esecutore_b_url }}
      # Chiave di regia: il dispatcher la manda come header X-Regia a /lavoro
      # dell'esecutore B (il Worker la confronta a tempo costante con env.REGIA_KEY).
      # Secret di repo: non compare né nel codice né nei log.
      REGIA_KEY: ${{ secrets.REGIA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg PINNATO dell'esecutore A (stessa build statica di B)
        run: |
          set -euo pipefail
          # UNA SOLA VERSIONE PER I DUE ESECUTORI (15/11/2026).
          # Questo è lo STESSO tarball, con lo STESSO sha256, che il Dockerfile di
          # `esecutore-b` (repo care-workers) installa nel container: la parità non è
          # dichiarata, è lo stesso binario su entrambi i lati.
          # Release con tag immutabile per data + `checksums.sha256` pubblicato nella
          # release. Variante GPL perché il lavoro usa l'encoder libx264 (l'LGPL non ce l'ha).
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-14-12-37/ffmpeg-n8.1.3-35-gf1acb0a266-linux64-gpl-8.1.tar.xz"
          FFMPEG_SHA256="b8277443ba6332534c1cdb272f7bfa8322905f22d08208f5db0b56bc17b5fb3e"
          FFMPEG_VERSIONE_ATTESA="n8.1.3-35-gf1acb0a266-20261114"
          curl -fsSL --retry 3 --retry-delay 2 "$FFMPEG_URL" -o /tmp/ffmpeg-pin.tar.xz
          echo "$FFMPEG_SHA256  /tmp/ffmpeg-pin.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg-pin"
          tar -xJf /tmp/ffmpeg-pin.tar.xz -C "$HOME/ffmpeg-pin" --strip-components=1
          # PATH in testa: se il runner avesse un ffmpeg di sistema, vince comunque il pin.
          echo "$HOME/ffmpeg-pin/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ffmpeg-pin/bin:$PATH"
          echo "ffmpeg in uso: $(which ffmpeg)"
          ffmpeg -version > /tmp/ff-a.txt 2>&1
          head -n 1 /tmp/ff-a.txt
          # Se il binario non è quello pinnato, il giro non vale: si ferma qui.
          if ! head -n 1 /tmp/ff-a.txt | grep -q "$FFMPEG_VERSIONE_ATTESA"; then
            echo "KO: l'esecutore A non ha la versione pinnata ($FFMPEG_VERSIONE_ATTESA)"
            exit 1
          fi
          node --check scripts/rete-doppio-esecutore.mjs
          # Presenza della chiave di regia (il valore non si stampa mai).
          if [ -z "${REGIA_KEY:-}" ]; then
            echo "ATTENZIONE: secret REGIA_KEY assente — /lavoro dell'esecutore B risponderà 403 e il record dichiarerà B_NON_DISPONIBILE (chiave-di-regia-assente)."
          else
            echo "chiave di regia presente (valore non stampato): verrà inviata come header X-Regia"
          fi

      - name: Esegui lo stesso lavoro su A e su B
        id: esegui
        continue-on-error: true
        run: |
          set +e
          node scripts/rete-doppio-esecutore.mjs
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Commit rete/doppio-esecutore.json (race-safe)
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain rete/doppio-esecutore.json)" ]; then
            echo "nessuna variazione da committare"
            exit 0
          fi
          git config user.name "rete-doppio-esecutore[bot]"
          git config user.email "info@puntoluce26.com"
          git add rete/doppio-esecutore.json
          git commit -m "rete: doppio esecutore $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushato al tentativo $i"
              exit 0
            fi
            git pull --rebase --autostash
          done
          echo "KO: push non riuscito dopo 5 tentativi"
          exit 1

      # 18/11/2026 — «B non configurato» NON è un guasto ma nemmeno una cosa da dimenticare: il record
      # lo dice (verdetto B_NON_CONFIGURATO + nota) e questa riga lo mette su R2 stato/allarmi/… con
      # livello `pending`, così la protezione mancante resta sul radar finché il container non esiste.
      - name: Se B non è configurato, allarme pending su R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -f rete/doppio-esecutore.json ] || { echo "nessun record, niente allarme"; exit 0; }
          V=$(node -e 'try{console.log(require("./rete/doppio-esecutore.json").verdetto||"")}catch(e){console.log("")}')
          if [ "$V" != "B_NON_CONFIGURATO" ]; then echo "verdetto $V: nessun allarme pending"; exit 0; fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { leggiStato, pubblicaStato } from "./scripts/stato-pubblica.mjs";
            const prev = await leggiStato("allarmi/rete-doppio-esecutore.json");
            const vecchi = prev && prev.ok && prev.json && Array.isArray(prev.json.allarmi) ? prev.json.allarmi : [];
            const runId = process.env.GITHUB_RUN_ID || null;
            const voce = {
              generato: new Date().toISOString(),
              workflow: "rete-doppio-esecutore",
              livello: "pending",
              messaggio: "esecutore B non configurato: protezione non attiva",
              runId,
              runUrl: runId ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}` : null,
            };
            const allarmi = [voce, ...vecchi].slice(0, 20);
            writeFileSync("/tmp/allarme-rete.json", JSON.stringify({ ...voce, allarmi }, null, 1) + "\n");
            const pub = await pubblicaStato("/tmp/allarme-rete.json", { chiave: "allarmi/rete-doppio-esecutore.json" });
            console.log("allarme pending registrato:", (pub && pub.key) || "stato/allarmi/rete-doppio-esecutore.json", "·", allarmi.length, "voci");
          '

      - name: Artefatto del giro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rete-doppio-esecutore
          path: rete/doppio-esecutore.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verdetto
        run: |
          set -euo pipefail
          node -e 'const j=require("./rete/doppio-esecutore.json");console.log("VERDETTO:", j.verdetto);console.log("A:", j.A.sha, j.A.versione);console.log("B:", j.B.sha, j.B.versione||"", j.B.errore||"")'
          ESITO="${{ steps.esegui.outputs.exit }}"
          echo "exit del dispatcher: $ESITO"
          if [ "$ESITO" != "0" ]; then
            echo "KO: la Rete+ non ha girato su due esecutori (exit $ESITO). Con un solo esecutore la ridondanza è 0 su 2."
            exit 1
          fi
