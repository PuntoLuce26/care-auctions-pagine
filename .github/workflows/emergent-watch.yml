name: emergent-watch
# 11/11/2026 — EMERGENT SORVEGLIATO DA FUORI (GitHub Actions).
# Il pannello di Emergent (CPU, memoria) è interno e non ha API pubblica: quello che possiamo
# misurare davvero è il comportamento visto da fuori — tempo di risposta, stato, dimensione HTML,
# hash del bundle. Se l'origine rallenta o cade, lo vediamo qui prima che lo vedano gli utenti.
# Storico in perf/emergent.json (max 500 punti) + stato in perf/stato.json.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emergent-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Misura l'origine e il sito
        run: node scripts/emergent-watch.mjs
      - name: Pubblica perf/stato.json su R2
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stato-pubblica.mjs perf/stato.json --verifica

      - name: Commit dello storico
        run: |
          git config user.name "CARe Cloud"
          git config user.email "cloud@careauctions.co"
          # 12/11/2026 — solo lo STORICO resta versionato: perf/stato.json è stato interno e vive
          # su R2 (bucket care-stato). Sei commit/24h su quel file, ognuno capace di cancellare
          # la build Pages in corso.
          git add perf/emergent.json
          git diff --cached --quiet && echo "nessuna variazione" && exit 0
          git commit -m "perf: misura emergent ($(date -u +%FT%TZ))"
          # 12/11/2026 — il passo moriva con exit 128 quando `git rebase --abort` non aveva
          # niente da abortire (bash -e sul secondo ramo di `||`): misurato sul run 43326522752
          # dopo che un altro commit aveva cambiato main. Ora il ramo di pulizia non può fallire.
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin main 2>/dev/null && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          echo "::error::push fallito"; exit 1
