name: rete-einstein
on:
  schedule: [{cron: "15 6 * * *"}]
  workflow_dispatch:
  # 15/11/2026 — la schedule dichiarata è la via normale; questa è la rete che non viene
  # diradata (la chiama la veglia, cron Cloudflare */5, quando l'ultimo giro è troppo vecchio).
  repository_dispatch:
    types: [rete-einstein-giro]
permissions: {contents: read}
concurrency: {group: rete-einstein, cancel-in-progress: false}
jobs:
  einstein:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - env: {ONLY: einstein}
        run: node rete/collaudo.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: rete-einstein-stato, path: rete/stato.json, retention-days: 30}
