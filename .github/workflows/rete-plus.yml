name: rete-plus
# RETE+ v1 (14/11/2026): VIDS+, EINSTEIN+, GREEN2+, EMERGENT+.
# Ogni gate ha casi buoni e cattivi; il verde è solo se tutti passano.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rete-plus
  cancel-in-progress: false

jobs:
  rete:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installa ffmpeg (VIDS+)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
      - name: Collaudo Rete+ (7 casi + produzione)
        env:
          BASE: https://careauctions.co
          FFMPEG: ffmpeg
          FFPROBE: ffprobe
        run: node rete/collaudo.mjs
      - name: Artefatto stato Rete+
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rete-plus-stato
          path: rete/stato.json
          retention-days: 30
      - name: Committa lo stato verde
        if: success()
        run: |
          set -euo pipefail
          git config user.name "CARe Rete+"
          git config user.email "rete@careauctions.co"
          git add rete/stato.json
          if git diff --cached --quiet; then echo "nessuna variazione"; exit 0; fi
          git commit -m "Rete+ collaudo $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push; then echo pubblicato; exit 0; fi
            sleep 4
          done
          echo "::error::push stato Rete+ fallito"; exit 1
      - name: Riepilogo
        if: always()
        run: |
          if [ -f rete/stato.json ]; then node -e 'const j=require("./rete/stato.json"); console.log("Rete+",j.verdetto, j.esiti.map(x=>x.gate+":"+(x.ok?"OK":"KO")).join(" "))'; fi
